name: Build Release Artifacts

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build-os-artifacts:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            build-cmd: flutter build windows
            artifact-dir: build/windows/x64/runner/Release
            artifact-target: .
          - os: ubuntu-latest
            platform: linux-x64
            build-cmd: flutter build linux
            artifact-dir: build/linux/x64/release/bundle
            artifact-target: .
          - os: macos-latest
            platform: macos
            build-cmd: flutter build macos
            artifact-dir: build/macos/Build/Products/Release
            artifact-target: vid2pdf.app

    env:
      # Manual runs have no release tag, so fall back to the commit SHA
      BUNDLE_BASE_NAME: vid2pdf-${{ github.event.release.tag_name || github.sha }}-${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        id: flutter-action
        with:
          channel: stable
          cache: false

      - name: Print Flutter Info
        env:
          ARCHITECTURE: ${{ steps.flutter-action.outputs.ARCHITECTURE }}
          CHANNEL: ${{ steps.flutter-action.outputs.CHANNEL }}
          VERSION: ${{ steps.flutter-action.outputs.VERSION }}
          CACHE_HIT: ${{ steps.flutter-action.outputs.CACHE-HIT }}
          PUB_CACHE_HIT: ${{ steps.flutter-action.outputs.PUB-CACHE-HIT }}
        run: |
          echo "ARCHITECTURE=${ARCHITECTURE}"
          echo "CHANNEL=${CHANNEL}"
          echo "VERSION=${VERSION}"
          echo "CACHE-HIT=${CACHE_HIT}"
          echo "PUB-CACHE-HIT=${PUB_CACHE_HIT}"

      - name: Install Required Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build Distribution (${{ matrix.os }})
        run: |
          echo "FFMPEG_PATH=" > .env
          ${{ matrix.build-cmd }}

      - name: Archive Distribution (${{ matrix.os }})
        id: archive
        env:
          ARTIFACT_DIR: ${{ matrix.artifact-dir }}
          ARTIFACT_TARGET: ${{ matrix.artifact-target }}
        run: |
          case "${RUNNER_OS}" in
            macOS)
              ARCHIVE="${BUNDLE_BASE_NAME}.zip"
              ditto -c -k --keepParent "${ARTIFACT_DIR}/${ARTIFACT_TARGET}" "${ARCHIVE}"
              ;;
            Linux)
              ARCHIVE="${BUNDLE_BASE_NAME}.tar.gz"
              tar -czf "${ARCHIVE}" -C "${ARTIFACT_DIR}" "${ARTIFACT_TARGET}"
              ;;
            Windows)
              ARCHIVE="${BUNDLE_BASE_NAME}.zip"
              (cd "${ARTIFACT_DIR}" && 7z a -tzip "${GITHUB_WORKSPACE}/${ARCHIVE}" "${ARTIFACT_TARGET}")
              ;;
          esac
          HASH=$(shasum -a 256 "${ARCHIVE}")
          echo "DIGEST=${HASH}"
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      - name: Upload Artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v7.0.1
        id: upload-artifact
        with:
          archive: false
          if-no-files-found: error
          path: ${{ steps.archive.outputs.archive }}

      - name: Print Artifact Info
        env:
          URL: ${{ steps.upload-artifact.outputs.artifact-url }}
          DIGEST: ${{ steps.upload-artifact.outputs.artifact-digest }}
        run: |
          echo "URL=${URL}"
          echo "DIGEST=${DIGEST}"

  publish-release-artifacts:
    name: Upload Artifacts to Release
    if: github.event_name == 'release'
    needs: build-os-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: vid2pdf-*
          merge-multiple: true
          # Archives were uploaded as-is, so keep the .zip files intact rather than extracting them
          skip-decompress: true

      - name: Upload Artifacts to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist
          gh release upload "${TAG_NAME}" dist/*
